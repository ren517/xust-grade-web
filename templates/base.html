<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}西科大教务助手{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E%E5%AD%A6%3C/text%3E%3C/svg%3E">

    {# 字体：Sora（展示/数字）+ Manrope（拉丁正文）+ Noto Sans SC（中文），CDN 不可达时回退系统中文字体 #}
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/800.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/chinese-simplified-400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/chinese-simplified-500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/chinese-simplified-700.css">

    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

{% block nav %}
<header class="nav">
    <div class="container nav-inner">
        <a class="brand" href="/" aria-label="返回首页">
            <span class="brand-logo" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 10v6"/></svg>
            </span>
            <span class="brand-name">西科大教务助手</span>
        </a>
        <nav class="nav-links" aria-label="主导航">
            <a href="/" {% if active == "home" %}class="active" aria-current="page"{% endif %}>首页</a>
            <a href="/schedule" {% if active == "schedule" %}class="active" aria-current="page"{% endif %}>每日课表</a>
            <a href="/score" {% if active == "score" %}class="active" aria-current="page"{% endif %}>成绩查询</a>
            <a href="/progress" {% if active == "progress" %}class="active" aria-current="page"{% endif %}>课程进度</a>
            <a href="/logout" class="nav-logout">退出登录</a>
        </nav>
    </div>
</header>
{% endblock %}

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

</body>

</html>
